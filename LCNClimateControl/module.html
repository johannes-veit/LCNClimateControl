<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
    /*
     * Farben stammen aus der geöffneten Symcon-Visualisierung. Der Browser-
     * bzw. Betriebssystem-Dark-Mode wird bewusst nicht separat ausgewertet.
     */
    --accent: var(--accent-color, #00c7a5);
    --surface: var(--card-color, #ffffff);
    --text: var(--content-color, #1f2328);
    --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
    --accent-border: color-mix(in srgb, var(--accent) 36%, transparent);
    --muted: color-mix(in srgb, var(--text) 62%, transparent);
    --line: color-mix(in srgb, var(--text) 20%, transparent);
    --control-bg: color-mix(in srgb, var(--text) 10%, transparent);
    --row-hover: color-mix(in srgb, var(--text) 5.5%, transparent);

    /*
     * Dieser Bereich gehört optisch dem von Symcon selbst gezeichneten
     * Instanznamen und dem Maximieren-Symbol. Er darf niemals Teil des
     * scrollenden Modul-Inhalts sein.
     */
    --symcon-title-zone: 62px;
}
* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: transparent;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
#app {
    width: 100%;
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-rows: var(--symcon-title-zone) minmax(0, 1fr);
    overflow: hidden;
    padding: 0;
    background: transparent;
}

/*
 * OPAKER TITELSCHUTZ
 * ------------------
 * Symcon zeichnet Instanzname/Maximieren über dem HTML-Inhalt. Dieser feste,
 * nicht scrollende Bereich liegt direkt darunter und besitzt denselben
 * Kartenhintergrund. Dadurch kann niemals eine Raumzeile hinter dem Titel
 * sichtbar werden, selbst wenn sehr weit nach unten gescrollt wird.
 */
.symcon-title-shield {
    grid-row: 1;
    min-height: var(--symcon-title-zone);
    background: var(--surface);
    position: relative;
    z-index: 50;
    pointer-events: none;
}

/*
 * Ausschließlich dieser Bereich scrollt. Das iframe/body selbst bleibt fest.
 * Dieses Muster verhindert die wiederkehrende Überschneidung mit dem
 * Symcon-Kachelkopf grundsätzlich statt nur mit zusätzlichem Padding.
 */
.content-scroll {
    grid-row: 2;
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-gutter: stable;
    padding: 0 14px 10px;
    background: var(--surface);
}
.mode-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 36px;

    /*
     * Bleibt innerhalb des einzigen scrollbaren Bereichs fest stehen.
     * Der separate Symcon-Titelbereich liegt darüber und scrollt ohnehin nicht.
     */
    position: sticky;
    top: 0;
    z-index: 40;
    margin: 0 -14px 7px;
    padding: 4px 14px 5px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
}
.mode-label {
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
}
.segmented {
    display: inline-flex;
    align-items: stretch;
    border: 1px solid var(--accent-border);
    background: var(--accent-soft);
    border-radius: 7px;
    overflow: hidden;
    min-height: 32px;
}
.segmented button {
    appearance: none;
    border: 0;
    margin: 0;
    padding: 5px 17px;
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 14px;
    line-height: 1.1;
    cursor: pointer;
    white-space: nowrap;
}
.segmented button.active {
    color: #fff;
    background: var(--accent);
}
.segmented button.pending {
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
}
.segmented button:disabled {
    cursor: default;
    opacity: 0.58;
}
.table {
    width: 100%;
}
.grid {
    display: grid;
    align-items: center;
    column-gap: 10px;
}
.grid.heat {
    grid-template-columns: minmax(110px, 1.15fr) minmax(190px, 3.2fr) 64px 64px;
}
.grid.cool {
    grid-template-columns: minmax(110px, 1.15fr) minmax(225px, 3.2fr) 64px;
}
.header {
    min-height: 24px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: uppercase;
}
.header > div:nth-last-child(-n+2) { text-align: right; }
.grid.cool.header > div:last-child { text-align: right; }
.room-row {
    min-height: 43px;
    border-bottom: 1px solid var(--line);
}
.room-row:last-child { border-bottom: 0; }
.room-row:hover { background: var(--row-hover); }
.room-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 500;
}
.room-row.busy .room-name::after {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-left: 6px;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: middle;
    animation: pulse 1s ease-in-out infinite alternate;
}
.value {
    text-align: right;
    white-space: nowrap;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
}
.value.target { font-weight: 600; }
.slider-wrap {
    display: grid;
    grid-template-columns: 28px minmax(70px, 1fr) 28px;
    gap: 7px;
    align-items: center;
    min-width: 0;
}
.step {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--accent);
    width: 28px;
    height: 28px;
    padding: 0;
    font-size: 23px;
    line-height: 28px;
    text-align: center;
    cursor: pointer;
    border-radius: 50%;
}
.step:hover:not(:disabled) { background: var(--accent-soft); }
.step:disabled { opacity: .28; cursor: default; }
input[type="range"] {
    width: 100%;
    min-width: 70px;
    height: 24px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
}
input[type="range"]:disabled { cursor: default; opacity: .56; }
.cool-switch { justify-self: stretch; }
.cool-switch.segmented { display: flex; width: 100%; }
.cool-switch button { flex: 1 1 50%; padding-left: 10px; padding-right: 10px; }
.note {
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
}
.empty {
    padding: 14px 0;
    color: var(--muted);
    font-size: 13px;
}
.error {
    margin-top: 8px;
    color: #c84a4a;
    font-size: 11px;
    line-height: 1.35;
}
.warning {
    margin-top: 8px;
    color: #b87400;
    font-size: 11px;
    line-height: 1.35;
}
.busy-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 6px;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: middle;
    opacity: 0;
}
.busy-dot.on {
    opacity: 1;
    animation: pulse 1s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
@media (max-width: 620px) {
    :root { --symcon-title-zone: 58px; }
    .content-scroll { padding: 0 8px 8px; }
    .mode-line {
        margin-left: -8px;
        margin-right: -8px;
        margin-bottom: 5px;
        padding-left: 8px;
        padding-right: 8px;
    }
    .mode-label { font-size: 14px; }
    .segmented button { font-size: 13px; padding: 5px 12px; }
    .grid { column-gap: 6px; }
    .grid.heat { grid-template-columns: minmax(76px, 1fr) minmax(122px, 2fr) 50px 50px; }
    .grid.cool { grid-template-columns: minmax(76px, 1fr) minmax(150px, 2fr) 50px; }
    .header { font-size: 9.5px; }
    .room-row { min-height: 40px; }
    .room-name, .value { font-size: 12.5px; }
    .slider-wrap { grid-template-columns: 24px minmax(58px, 1fr) 24px; gap: 4px; }
    .step { width: 24px; height: 26px; line-height: 24px; font-size: 20px; }
    .cool-switch button { font-size: 11.5px; padding-left: 5px; padding-right: 5px; }
    .note { font-size: 10px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

let lcncInitialState = {};
/*__LCNC_INITIAL_STATE__*/

let state = normalizeState(lcncInitialState);
let renderedMode = null;
let renderedSignature = '';
let ui = {
    root: null,
    busyDot: null,
    modeHeat: null,
    modeCool: null,
    table: null,
    note: null,
    error: null,
    warning: null,
    rows: new Map()
};

const draggingTargets = new Set();

let actionInFlight = null;
let queuedAction = null;
let actionTimeout = 0;
let actionGeneration = 0;
let queueTimer = 0;
let lastActionKey = '';
let lastActionTime = 0;

const ACTION_GUARD_MS = 180;
const ACTION_TIMEOUT_MS = 6000;
const QUEUE_DELAY_MS = 45;

function normalizeState(input) {
    const base = {
        type: 'state',
        mode: 0,
        pendingMode: null,
        busy: false,
        error: '',
        rows: []
    };
    if (!input || typeof input !== 'object') return base;
    return {...base, ...input, rows: Array.isArray(input.rows) ? input.rows : []};
}

function parseMessage(data) {
    if (typeof data === 'string') {
        try { return JSON.parse(data); } catch (_) { return null; }
    }
    return data && typeof data === 'object' ? data : null;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function formatTemp(value, digits = 1) {
    if (value === null || value === undefined || Number.isNaN(Number(value))) return '–';
    return Number(value).toLocaleString('de-DE', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
    }) + ' °C';
}

function formatTarget(value) {
    if (value === null || value === undefined || Number.isNaN(Number(value))) return '–';
    return Math.round(Number(value)).toLocaleString('de-DE') + ' °C';
}

function rowKey(row) {
    return String(row.targetId);
}

function structureSignature(nextState) {
    const rows = Array.isArray(nextState.rows) ? nextState.rows : [];
    return `${Number(nextState.mode) === 1 ? 1 : 0}|` +
        rows.map(row => `${rowKey(row)}:${row.name || ''}`).join('|');
}

function getRow(targetId) {
    return state.rows.find(row => String(row.targetId) === String(targetId)) || null;
}

function upsertRow(nextRow) {
    if (!nextRow || nextRow.targetId === undefined || nextRow.targetId === null) return;
    const key = String(nextRow.targetId);
    const index = state.rows.findIndex(row => String(row.targetId) === key);
    if (index >= 0) {
        state.rows[index] = {...state.rows[index], ...nextRow};
    } else {
        state.rows.push(nextRow);
    }
}

function actionKey(ident, value) {
    return `${ident}:${JSON.stringify(value)}`;
}

function isActionAcknowledged(message, action) {
    if (!action || !message) return false;

    if (action.ident === 'Mode') {
        const requested = Number(action.value);
        if (message.type === 'state' || message.type === 'meta') {
            return Number(message.mode) === requested || Number(message.pendingMode) === requested;
        }
        return false;
    }

    const targetId = String(action.targetId ?? '');
    const row = message.type === 'row' ? message.row : null;

    if (row && String(row.targetId) === targetId) {
        if (action.kind === 'heat') {
            return Math.abs(Number(row.displayTarget) - Number(action.value)) < 0.25;
        }
        if (action.kind === 'cool') {
            return Boolean(row.cooling) === Boolean(action.value);
        }
    }

    if (message.type === 'state') {
        const stateRow = (message.rows || []).find(item => String(item.targetId) === targetId);
        if (!stateRow) return false;
        if (action.kind === 'heat') {
            return Math.abs(Number(stateRow.displayTarget) - Number(action.value)) < 0.25;
        }
        if (action.kind === 'cool') {
            return Boolean(stateRow.cooling) === Boolean(action.value);
        }
    }

    return false;
}

function clearActionInFlight(dispatchQueued = true) {
    actionGeneration += 1;
    actionInFlight = null;

    if (actionTimeout) {
        window.clearTimeout(actionTimeout);
        actionTimeout = 0;
    }

    if (dispatchQueued) {
        scheduleQueuedAction();
    }
}

function scheduleQueuedAction() {
    if (actionInFlight || !queuedAction || queueTimer) return;

    queueTimer = window.setTimeout(() => {
        queueTimer = 0;
        if (actionInFlight || !queuedAction) return;
        const next = queuedAction;
        queuedAction = null;
        dispatchAction(next);
    }, QUEUE_DELAY_MS);
}

function showWarning(message) {
    if (!ui.warning) return;
    ui.warning.textContent = message;
    ui.warning.hidden = false;

    window.clearTimeout(showWarning.timer);
    showWarning.timer = window.setTimeout(() => {
        if (ui.warning) ui.warning.hidden = true;
    }, 5000);
}

function dispatchAction(action) {
    const now = Date.now();
    const key = actionKey(action.ident, action.value);
    if (key === lastActionKey && now - lastActionTime < ACTION_GUARD_MS) return;

    lastActionKey = key;
    lastActionTime = now;
    actionInFlight = {...action, time: now};
    actionGeneration += 1;
    const generation = actionGeneration;

    if (actionTimeout) window.clearTimeout(actionTimeout);
    actionTimeout = window.setTimeout(() => {
        if (!actionInFlight || generation !== actionGeneration) return;
        clearActionInFlight(true);
        showWarning('Keine Rückmeldung von Symcon. Die tatsächliche LCN-Stellung wurde nicht automatisch erneut verändert.');
    }, ACTION_TIMEOUT_MS);

    try {
        const result = requestAction(action.ident, action.value);
        if (result && typeof result.then === 'function') {
            result.catch(error => {
                clearActionInFlight(true);
                showWarning('Symcon-Kommunikation fehlgeschlagen: ' + String(error?.message || error));
            });
        }
    } catch (error) {
        clearActionInFlight(true);
        showWarning('Symcon-Kommunikation fehlgeschlagen: ' + String(error?.message || error));
    }
}

function sendAction(action) {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        showWarning('Keine Netzwerkverbindung. Es wurde kein Befehl an Symcon gesendet.');
        return;
    }

    if (actionInFlight || queueTimer) {
        // Keine parallelen /api/-Aufrufe. Nur der jeweils neueste Folgewunsch
        // bleibt erhalten und wird direkt nach der Serverbestätigung gesendet.
        queuedAction = action;
        return;
    }

    dispatchAction(action);
}

function makeButton(text, className = '') {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = text;
    if (className) button.className = className;
    return button;
}

function buildMode(root) {
    const line = document.createElement('div');
    line.className = 'mode-line';

    const label = document.createElement('div');
    label.className = 'mode-label';
    label.textContent = 'Betriebsart';

    const dot = document.createElement('span');
    dot.className = 'busy-dot';
    label.appendChild(dot);

    const switcher = document.createElement('div');
    switcher.className = 'segmented';

    const heat = makeButton('Heizen');
    const cool = makeButton('Kühlen');

    heat.addEventListener('click', () => {
        const selected = state.pendingMode === null ? Number(state.mode) : Number(state.pendingMode);
        if (selected === 0 && state.pendingMode === null) return;

        state.pendingMode = Number(state.mode) === 0 ? null : 0;
        patchMode();
        sendAction({ident: 'Mode', value: 0, kind: 'mode'});
    });

    cool.addEventListener('click', () => {
        const selected = state.pendingMode === null ? Number(state.mode) : Number(state.pendingMode);
        if (selected === 1 && state.pendingMode === null) return;

        state.pendingMode = Number(state.mode) === 1 ? null : 1;
        patchMode();
        sendAction({ident: 'Mode', value: 1, kind: 'mode'});
    });

    switcher.appendChild(heat);
    switcher.appendChild(cool);
    line.appendChild(label);
    line.appendChild(switcher);
    root.appendChild(line);

    ui.busyDot = dot;
    ui.modeHeat = heat;
    ui.modeCool = cool;
}

function makeHeader(mode) {
    const header = document.createElement('div');
    header.className = 'grid header ' + (mode === 0 ? 'heat' : 'cool');

    const labels = mode === 0
        ? ['Raum', 'Solltemperatur', 'Soll', 'Ist']
        : ['Raum', 'Kühlung', 'Ist'];

    labels.forEach(text => {
        const cell = document.createElement('div');
        cell.textContent = text;
        header.appendChild(cell);
    });
    return header;
}

function createHeatRow(row) {
    const targetId = rowKey(row);
    const grid = document.createElement('div');
    grid.className = 'grid room-row heat';

    const name = document.createElement('div');
    name.className = 'room-name';

    const sliderWrap = document.createElement('div');
    sliderWrap.className = 'slider-wrap';

    const minus = makeButton('−', 'step');
    minus.title = '1 °C niedriger';

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = '18';
    slider.max = '24';
    slider.step = '1';
    slider.setAttribute('aria-label', (row.name || 'Raum') + ' Solltemperatur');

    const plus = makeButton('+', 'step');
    plus.title = '1 °C höher';

    const targetValue = document.createElement('div');
    targetValue.className = 'value target';

    const actual = document.createElement('div');
    actual.className = 'value';

    minus.addEventListener('click', () => {
        const current = getRow(targetId);
        if (!current) return;
        const raw = current.displayTarget === null || current.displayTarget === undefined
            ? 18
            : Math.round(Number(current.displayTarget));
        const desired = clamp(raw - 1, 18, 24);
        current.displayTarget = desired;
        patchHeatRow(current);
        sendAction({
            ident: current.heatIdent,
            value: desired,
            kind: 'heat',
            targetId: current.targetId
        });
    });

    plus.addEventListener('click', () => {
        const current = getRow(targetId);
        if (!current) return;
        const raw = current.displayTarget === null || current.displayTarget === undefined
            ? 18
            : Math.round(Number(current.displayTarget));
        const desired = raw < 18 ? 18 : clamp(raw + 1, 18, 24);
        current.displayTarget = desired;
        patchHeatRow(current);
        sendAction({
            ident: current.heatIdent,
            value: desired,
            kind: 'heat',
            targetId: current.targetId
        });
    });

    slider.addEventListener('pointerdown', () => draggingTargets.add(targetId));
    slider.addEventListener('input', () => {
        draggingTargets.add(targetId);
        const current = getRow(targetId);
        if (!current) return;
        current.displayTarget = Number(slider.value);
        targetValue.textContent = formatTarget(current.displayTarget);
        minus.disabled = Number(slider.value) <= 18;
        plus.disabled = Number(slider.value) >= 24;
    });
    slider.addEventListener('change', () => {
        const current = getRow(targetId);
        if (!current) return;
        const desired = Number(slider.value);
        current.displayTarget = desired;
        draggingTargets.delete(targetId);
        patchHeatRow(current);
        sendAction({
            ident: current.heatIdent,
            value: desired,
            kind: 'heat',
            targetId: current.targetId
        });
    });
    slider.addEventListener('pointerup', () => draggingTargets.delete(targetId));
    slider.addEventListener('pointercancel', () => draggingTargets.delete(targetId));

    sliderWrap.appendChild(minus);
    sliderWrap.appendChild(slider);
    sliderWrap.appendChild(plus);

    grid.appendChild(name);
    grid.appendChild(sliderWrap);
    grid.appendChild(targetValue);
    grid.appendChild(actual);

    ui.rows.set(targetId, {
        type: 'heat', grid, name, minus, slider, plus, targetValue, actual
    });

    patchHeatRow(row);
    return grid;
}

function createCoolRow(row) {
    const targetId = rowKey(row);
    const grid = document.createElement('div');
    grid.className = 'grid room-row cool';

    const name = document.createElement('div');
    name.className = 'room-name';

    const switcher = document.createElement('div');
    switcher.className = 'segmented cool-switch';

    const off = makeButton('Nicht kühlen');
    const on = makeButton('Kühlen');

    off.addEventListener('click', () => {
        const current = getRow(targetId);
        if (!current || current.cooling === false) return;
        current.cooling = false;
        patchCoolRow(current);
        sendAction({
            ident: current.coolIdent,
            value: false,
            kind: 'cool',
            targetId: current.targetId
        });
    });

    on.addEventListener('click', () => {
        const current = getRow(targetId);
        if (!current || current.cooling === true) return;
        current.cooling = true;
        patchCoolRow(current);
        sendAction({
            ident: current.coolIdent,
            value: true,
            kind: 'cool',
            targetId: current.targetId
        });
    });

    switcher.appendChild(off);
    switcher.appendChild(on);

    const actual = document.createElement('div');
    actual.className = 'value';

    grid.appendChild(name);
    grid.appendChild(switcher);
    grid.appendChild(actual);

    ui.rows.set(targetId, {type: 'cool', grid, name, off, on, actual});
    patchCoolRow(row);
    return grid;
}

function patchHeatRow(row) {
    const ref = ui.rows.get(rowKey(row));
    if (!ref || ref.type !== 'heat') return;

    const raw = row.displayTarget === null || row.displayTarget === undefined
        ? 18
        : Math.round(Number(row.displayTarget));
    const sliderValue = clamp(raw, 18, 24);

    ref.grid.classList.toggle('busy', Boolean(row.busy));
    ref.name.textContent = row.name || 'Raum';
    ref.name.title = row.name || '';

    if (!draggingTargets.has(rowKey(row))) {
        ref.slider.value = String(sliderValue);
    }

    ref.targetValue.textContent = formatTarget(row.displayTarget);
    ref.actual.textContent = formatTemp(row.temperature, 1);
    ref.slider.disabled = false;
    ref.minus.disabled = raw <= 18;
    ref.plus.disabled = raw >= 24;
}

function patchCoolRow(row) {
    const ref = ui.rows.get(rowKey(row));
    if (!ref || ref.type !== 'cool') return;

    ref.grid.classList.toggle('busy', Boolean(row.busy));
    ref.name.textContent = row.name || 'Raum';
    ref.name.title = row.name || '';
    ref.actual.textContent = formatTemp(row.temperature, 1);
    ref.off.classList.toggle('active', !Boolean(row.cooling));
    ref.on.classList.toggle('active', Boolean(row.cooling));
    ref.off.disabled = false;
    ref.on.disabled = false;
}

function patchMode() {
    const selectedMode = state.pendingMode === null || state.pendingMode === undefined
        ? Number(state.mode)
        : Number(state.pendingMode);

    if (ui.modeHeat) {
        ui.modeHeat.classList.toggle('active', selectedMode === 0);
        ui.modeHeat.classList.toggle('pending', state.pendingMode !== null && Number(state.pendingMode) === 0);
        ui.modeHeat.disabled = false;
    }
    if (ui.modeCool) {
        ui.modeCool.classList.toggle('active', selectedMode === 1);
        ui.modeCool.classList.toggle('pending', state.pendingMode !== null && Number(state.pendingMode) === 1);
        ui.modeCool.disabled = false;
    }
    if (ui.busyDot) {
        const active = Boolean(state.busy) || state.pendingMode !== null;
        ui.busyDot.classList.toggle('on', active);
        ui.busyDot.title = state.pendingMode !== null
            ? 'Betriebsartwechsel vorgemerkt'
            : (state.busy ? 'Einstellung läuft' : '');
    }
}

function patchMeta() {
    if (ui.note) {
        ui.note.hidden = Number(state.mode) !== 1;
    }
    if (ui.error) {
        const hasError = Boolean(state.error);
        ui.error.hidden = !hasError;
        ui.error.textContent = hasError ? state.error : '';
    }
}

function patchUI() {
    patchMode();
    state.rows.forEach(row => {
        if (Number(state.mode) === 0) patchHeatRow(row);
        else patchCoolRow(row);
    });
    patchMeta();
}

function renderStructure() {
    const root = document.getElementById('app');
    ui.root = root;
    ui.rows = new Map();
    root.replaceChildren();

    // Der erste Grid-Bereich bleibt immer unbewegt und deckt den Bereich unter
    // dem von Symcon selbst gezeichneten Instanznamen opak ab.
    const titleShield = document.createElement('div');
    titleShield.className = 'symcon-title-shield';
    titleShield.setAttribute('aria-hidden', 'true');

    // Nur dieser zweite Bereich darf scrollen. Dadurch können Raumzeilen den
    // Symcon-Titelbereich konstruktiv nicht mehr erreichen.
    const content = document.createElement('div');
    content.className = 'content-scroll';

    root.appendChild(titleShield);
    root.appendChild(content);

    buildMode(content);

    if (state.rows.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Keine aktiven Räume konfiguriert.';
        content.appendChild(empty);
    } else {
        const mode = Number(state.mode) === 1 ? 1 : 0;
        const table = document.createElement('div');
        table.className = 'table';
        table.appendChild(makeHeader(mode));
        state.rows.forEach(row => table.appendChild(mode === 0 ? createHeatRow(row) : createCoolRow(row)));
        content.appendChild(table);
        ui.table = table;
    }

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'Kühlen = FHB-Ventil geöffnet · Nicht kühlen = FHB-Ventil geschlossen';
    content.appendChild(note);
    ui.note = note;

    const error = document.createElement('div');
    error.className = 'error';
    error.hidden = true;
    content.appendChild(error);
    ui.error = error;

    const warning = document.createElement('div');
    warning.className = 'warning';
    warning.hidden = true;
    content.appendChild(warning);
    ui.warning = warning;

    renderedMode = Number(state.mode) === 1 ? 1 : 0;
    renderedSignature = structureSignature(state);
    patchUI();
}

function applyMessage(message) {
    if (!message) return;

    if (message.type === 'state' || !message.type) {
        state = normalizeState(message);
        const nextMode = Number(state.mode) === 1 ? 1 : 0;
        const nextSignature = structureSignature(state);
        if (renderedMode !== nextMode || renderedSignature !== nextSignature) {
            renderStructure();
        } else {
            patchUI();
        }
        return;
    }

    if (message.type === 'meta') {
        state.mode = Number(message.mode) === 1 ? 1 : 0;
        state.pendingMode = message.pendingMode === null || message.pendingMode === undefined
            ? null
            : Number(message.pendingMode);
        state.busy = Boolean(message.busy);
        state.error = message.error || '';

        const nextMode = Number(state.mode) === 1 ? 1 : 0;
        if (renderedMode !== nextMode) renderStructure();
        else {
            patchMode();
            patchMeta();
        }
        return;
    }

    if (message.type === 'row' && message.row) {
        upsertRow(message.row);
        const row = getRow(message.row.targetId);
        if (!row) return;
        if (Number(state.mode) === 0) patchHeatRow(row);
        else patchCoolRow(row);
        return;
    }

    if (message.type === 'temperature') {
        const row = getRow(message.targetId);
        if (!row) return;
        row.temperature = message.temperature;
        if (Number(state.mode) === 0) patchHeatRow(row);
        else patchCoolRow(row);
    }
}

function handleMessage(data) {
    const message = parseMessage(data);
    if (!message) {
        showWarning('Ungültige Visualisierungsdaten von Symcon.');
        return;
    }

    applyMessage(message);

    if (actionInFlight && isActionAcknowledged(message, actionInFlight)) {
        clearActionInFlight(true);
    }
}

renderStructure();
</script>
</body>
</html>
