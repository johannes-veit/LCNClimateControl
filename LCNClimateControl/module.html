<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
    color-scheme: light dark;
    --accent: #00c7a5;
    --accent-soft: rgba(0, 199, 165, 0.15);
    --accent-border: rgba(0, 199, 165, 0.36);
    --text: #1f2328;
    --muted: #6f7780;
    --line: rgba(127, 127, 127, 0.22);
    --control-bg: rgba(127, 127, 127, 0.10);
    --row-hover: rgba(127, 127, 127, 0.055);
}
@media (prefers-color-scheme: dark) {
    :root {
        --text: #f1f3f4;
        --muted: #aeb4ba;
        --line: rgba(255, 255, 255, 0.14);
        --control-bg: rgba(255, 255, 255, 0.08);
        --row-hover: rgba(255, 255, 255, 0.04);
    }
}
* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
body { overflow: auto; }
#app {
    width: 100%;
    /*
     * Der obere Bereich der Kachel gehört Symcon selbst (Instanzname + Maximieren).
     * Deshalb beginnt unsere eigene Bedienoberfläche bewusst deutlich darunter.
     * So überlagert "Betriebsart" niemals mehr den von Symcon gezeichneten Titel.
     */
    padding: 48px 14px 10px;
}
.mode-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 36px;
    margin-bottom: 7px;
}
.mode-label {
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
}
.segmented {
    display: inline-flex;
    align-items: stretch;
    border: 1px solid var(--accent-border);
    background: var(--accent-soft);
    border-radius: 7px;
    overflow: hidden;
    min-height: 32px;
}
.segmented button {
    appearance: none;
    border: 0;
    margin: 0;
    padding: 5px 17px;
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 14px;
    line-height: 1.1;
    cursor: pointer;
    white-space: nowrap;
}
.segmented button.active {
    color: #fff;
    background: var(--accent);
}
.segmented button:disabled {
    cursor: default;
    opacity: 0.58;
}
.table {
    width: 100%;
}
.grid {
    display: grid;
    align-items: center;
    column-gap: 10px;
}
.grid.heat {
    grid-template-columns: minmax(110px, 1.15fr) minmax(190px, 3.2fr) 64px 64px;
}
.grid.cool {
    grid-template-columns: minmax(110px, 1.15fr) minmax(225px, 3.2fr) 64px;
}
.header {
    min-height: 24px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: uppercase;
}
.header > div:nth-last-child(-n+2) { text-align: right; }
.grid.cool.header > div:last-child { text-align: right; }
.room-row {
    min-height: 43px;
    border-bottom: 1px solid var(--line);
    transition: background .12s ease;
}
.room-row:last-child { border-bottom: 0; }
.room-row:hover { background: var(--row-hover); }
.room-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 500;
}
.room-row.busy .room-name::after {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-left: 6px;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: middle;
    animation: pulse 1s ease-in-out infinite alternate;
}
.value {
    text-align: right;
    white-space: nowrap;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
}
.value.target { font-weight: 600; }
.slider-wrap {
    display: grid;
    grid-template-columns: 28px minmax(70px, 1fr) 28px;
    gap: 7px;
    align-items: center;
    min-width: 0;
}
.step {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--accent);
    width: 28px;
    height: 28px;
    padding: 0;
    font-size: 23px;
    line-height: 28px;
    text-align: center;
    cursor: pointer;
    border-radius: 50%;
}
.step:hover:not(:disabled) { background: var(--accent-soft); }
.step:disabled { opacity: .28; cursor: default; }
input[type="range"] {
    width: 100%;
    min-width: 70px;
    height: 24px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
}
input[type="range"]:disabled { cursor: default; opacity: .56; }
.cool-switch { justify-self: stretch; }
.cool-switch.segmented { display: flex; width: 100%; }
.cool-switch button { flex: 1 1 50%; padding-left: 10px; padding-right: 10px; }
.note {
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
}
.empty {
    padding: 14px 0;
    color: var(--muted);
    font-size: 13px;
}
.error {
    margin-top: 8px;
    color: #c84a4a;
    font-size: 11px;
    line-height: 1.35;
}
.busy-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 6px;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: middle;
    opacity: 0;
}
.busy-dot.on {
    opacity: 1;
    animation: pulse 1s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
@media (max-width: 620px) {
    #app { padding: 44px 8px 8px; }
    .mode-line { margin-bottom: 5px; }
    .mode-label { font-size: 14px; }
    .segmented button { font-size: 13px; padding: 5px 12px; }
    .grid { column-gap: 6px; }
    .grid.heat { grid-template-columns: minmax(76px, 1fr) minmax(122px, 2fr) 50px 50px; }
    .grid.cool { grid-template-columns: minmax(76px, 1fr) minmax(150px, 2fr) 50px; }
    .header { font-size: 9.5px; }
    .room-row { min-height: 40px; }
    .room-name, .value { font-size: 12.5px; }
    .slider-wrap { grid-template-columns: 24px minmax(58px, 1fr) 24px; gap: 4px; }
    .step { width: 24px; height: 26px; line-height: 24px; font-size: 20px; }
    .cool-switch button { font-size: 11.5px; padding-left: 5px; padding-right: 5px; }
    .note { font-size: 10px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

let lcncInitialState = {};
/*__LCNC_INITIAL_STATE__*/

let state = lcncInitialState || { mode: 0, busy: false, error: '', rows: [] };
let renderedMode = null;
let renderedSignature = '';
let ui = {
    root: null,
    busyDot: null,
    modeHeat: null,
    modeCool: null,
    table: null,
    note: null,
    error: null,
    rows: new Map()
};
const draggingTargets = new Set();
const lastAction = new Map();
const ACTION_GUARD_MS = 110;

function parseState(data) {
    if (typeof data === 'string') {
        try { return JSON.parse(data); } catch (_) { return state; }
    }
    return data && typeof data === 'object' ? data : state;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function formatTemp(value, digits = 1) {
    if (value === null || value === undefined || Number.isNaN(Number(value))) return '–';
    return Number(value).toLocaleString('de-DE', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
    }) + ' °C';
}

function formatTarget(value) {
    if (value === null || value === undefined || Number.isNaN(Number(value))) return '–';
    return Math.round(Number(value)).toLocaleString('de-DE') + ' °C';
}

function rowKey(row) {
    return String(row.targetId);
}

function structureSignature(nextState) {
    const rows = Array.isArray(nextState.rows) ? nextState.rows : [];
    return `${Number(nextState.mode) === 1 ? 1 : 0}|` +
        rows.map(row => `${rowKey(row)}:${row.name || ''}`).join('|');
}

function getRow(targetId) {
    const rows = Array.isArray(state.rows) ? state.rows : [];
    return rows.find(row => String(row.targetId) === String(targetId)) || null;
}

function sendActionFast(ident, value) {
    const now = Date.now();
    const key = `${ident}:${String(value)}`;
    const previous = lastAction.get(key) || 0;
    if (now - previous < ACTION_GUARD_MS) return;
    lastAction.set(key, now);

    try {
        requestAction(ident, value);
    } catch (_) {
        // Der nächste echte Serverzustand synchronisiert die Anzeige wieder.
    }
}

function makeButton(text, className = '') {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = text;
    if (className) button.className = className;
    return button;
}

function buildMode(root) {
    const line = document.createElement('div');
    line.className = 'mode-line';

    const label = document.createElement('div');
    label.className = 'mode-label';
    label.textContent = 'Betriebsart';

    const dot = document.createElement('span');
    dot.className = 'busy-dot';
    label.appendChild(dot);

    const switcher = document.createElement('div');
    switcher.className = 'segmented';

    const heat = makeButton('Heizen');
    const cool = makeButton('Kühlen');

    heat.addEventListener('click', () => {
        if (state.busy || Number(state.mode) === 0) return;
        sendActionFast('Mode', 0);
    });

    cool.addEventListener('click', () => {
        if (state.busy || Number(state.mode) === 1) return;
        sendActionFast('Mode', 1);
    });

    switcher.appendChild(heat);
    switcher.appendChild(cool);
    line.appendChild(label);
    line.appendChild(switcher);
    root.appendChild(line);

    ui.busyDot = dot;
    ui.modeHeat = heat;
    ui.modeCool = cool;
}

function makeHeader(mode) {
    const header = document.createElement('div');
    header.className = 'grid header ' + (mode === 0 ? 'heat' : 'cool');

    const labels = mode === 0
        ? ['Raum', 'Solltemperatur', 'Soll', 'Ist']
        : ['Raum', 'Kühlung', 'Ist'];

    labels.forEach(text => {
        const cell = document.createElement('div');
        cell.textContent = text;
        header.appendChild(cell);
    });
    return header;
}

function createHeatRow(row) {
    const targetId = rowKey(row);
    const grid = document.createElement('div');
    grid.className = 'grid room-row heat';

    const name = document.createElement('div');
    name.className = 'room-name';
    name.textContent = row.name || 'Raum';
    name.title = row.name || '';

    const sliderWrap = document.createElement('div');
    sliderWrap.className = 'slider-wrap';

    const minus = makeButton('−', 'step');
    minus.title = '1 °C niedriger';

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = '18';
    slider.max = '24';
    slider.step = '1';
    slider.setAttribute('aria-label', (row.name || 'Raum') + ' Solltemperatur');

    const plus = makeButton('+', 'step');
    plus.title = '1 °C höher';

    const targetValue = document.createElement('div');
    targetValue.className = 'value target';

    const actual = document.createElement('div');
    actual.className = 'value';

    minus.addEventListener('click', () => {
        const current = getRow(targetId);
        if (!current) return;
        const raw = current.displayTarget === null || current.displayTarget === undefined
            ? 18
            : Math.round(Number(current.displayTarget));
        const desired = clamp(raw - 1, 18, 24);
        current.displayTarget = desired;
        patchHeatRow(current);
        sendActionFast(current.heatIdent, desired);
    });

    plus.addEventListener('click', () => {
        const current = getRow(targetId);
        if (!current) return;
        const raw = current.displayTarget === null || current.displayTarget === undefined
            ? 18
            : Math.round(Number(current.displayTarget));
        const desired = raw < 18 ? 18 : clamp(raw + 1, 18, 24);
        current.displayTarget = desired;
        patchHeatRow(current);
        sendActionFast(current.heatIdent, desired);
    });

    slider.addEventListener('pointerdown', () => draggingTargets.add(targetId));
    slider.addEventListener('input', () => {
        draggingTargets.add(targetId);
        const current = getRow(targetId);
        if (!current) return;
        current.displayTarget = Number(slider.value);
        targetValue.textContent = formatTarget(current.displayTarget);
        minus.disabled = Number(slider.value) <= 18;
        plus.disabled = Number(slider.value) >= 24;
    });
    slider.addEventListener('change', () => {
        const current = getRow(targetId);
        if (!current) return;
        const desired = Number(slider.value);
        current.displayTarget = desired;
        draggingTargets.delete(targetId);
        patchHeatRow(current);
        sendActionFast(current.heatIdent, desired);
    });
    slider.addEventListener('pointerup', () => draggingTargets.delete(targetId));
    slider.addEventListener('pointercancel', () => draggingTargets.delete(targetId));

    sliderWrap.appendChild(minus);
    sliderWrap.appendChild(slider);
    sliderWrap.appendChild(plus);

    grid.appendChild(name);
    grid.appendChild(sliderWrap);
    grid.appendChild(targetValue);
    grid.appendChild(actual);

    ui.rows.set(targetId, {
        type: 'heat',
        grid,
        name,
        minus,
        slider,
        plus,
        targetValue,
        actual
    });

    patchHeatRow(row);
    return grid;
}

function createCoolRow(row) {
    const targetId = rowKey(row);
    const grid = document.createElement('div');
    grid.className = 'grid room-row cool';

    const name = document.createElement('div');
    name.className = 'room-name';
    name.textContent = row.name || 'Raum';
    name.title = row.name || '';

    const switcher = document.createElement('div');
    switcher.className = 'segmented cool-switch';

    const off = makeButton('Nicht kühlen');
    const on = makeButton('Kühlen');

    off.addEventListener('click', () => {
        const current = getRow(targetId);
        if (!current || current.cooling === false) return;
        current.cooling = false;
        patchCoolRow(current);
        sendActionFast(current.coolIdent, false);
    });

    on.addEventListener('click', () => {
        const current = getRow(targetId);
        if (!current || current.cooling === true) return;
        current.cooling = true;
        patchCoolRow(current);
        sendActionFast(current.coolIdent, true);
    });

    switcher.appendChild(off);
    switcher.appendChild(on);

    const actual = document.createElement('div');
    actual.className = 'value';

    grid.appendChild(name);
    grid.appendChild(switcher);
    grid.appendChild(actual);

    ui.rows.set(targetId, {
        type: 'cool',
        grid,
        name,
        off,
        on,
        actual
    });

    patchCoolRow(row);
    return grid;
}

function patchHeatRow(row) {
    const ref = ui.rows.get(rowKey(row));
    if (!ref || ref.type !== 'heat') return;

    const raw = row.displayTarget === null || row.displayTarget === undefined
        ? 18
        : Math.round(Number(row.displayTarget));
    const sliderValue = clamp(raw, 18, 24);

    ref.grid.classList.toggle('busy', Boolean(row.busy));
    ref.name.textContent = row.name || 'Raum';
    ref.name.title = row.name || '';

    // Während der Benutzer den Regler aktiv bewegt, darf eine parallel
    // eintreffende Busmeldung den Schieber nicht unter dem Finger versetzen.
    if (!draggingTargets.has(rowKey(row))) {
        ref.slider.value = String(sliderValue);
    }

    ref.targetValue.textContent = formatTarget(row.displayTarget);
    ref.actual.textContent = formatTemp(row.temperature, 1);

    // Heizsollwert darf auch während einer laufenden Fahrt sofort neu gewählt
    // werden. Das Backend retargetet den aktuellen Auftrag nach der bestätigten
    // laufenden LCN-Stufe.
    ref.slider.disabled = false;
    ref.minus.disabled = raw <= 18;
    ref.plus.disabled = raw >= 24;
}

function patchCoolRow(row) {
    const ref = ui.rows.get(rowKey(row));
    if (!ref || ref.type !== 'cool') return;

    ref.grid.classList.toggle('busy', Boolean(row.busy));
    ref.name.textContent = row.name || 'Raum';
    ref.name.title = row.name || '';
    ref.actual.textContent = formatTemp(row.temperature, 1);

    ref.off.classList.toggle('active', !Boolean(row.cooling));
    ref.on.classList.toggle('active', Boolean(row.cooling));

    // Kühlaufträge dürfen seriell in die Queue gelegt bzw. für denselben Raum
    // durch den jeweils neuesten noch wartenden Wunsch ersetzt werden.
    ref.off.disabled = false;
    ref.on.disabled = false;
}

function patchMode() {
    const cooling = Number(state.mode) === 1;
    if (ui.modeHeat) {
        ui.modeHeat.classList.toggle('active', !cooling);
        ui.modeHeat.disabled = Boolean(state.busy);
    }
    if (ui.modeCool) {
        ui.modeCool.classList.toggle('active', cooling);
        ui.modeCool.disabled = Boolean(state.busy);
    }
    if (ui.busyDot) {
        ui.busyDot.classList.toggle('on', Boolean(state.busy));
        ui.busyDot.title = state.busy ? 'Einstellung läuft' : '';
    }
}

function patchMeta() {
    if (ui.note) {
        ui.note.hidden = Number(state.mode) !== 1;
    }

    if (ui.error) {
        const hasError = Boolean(state.error);
        ui.error.hidden = !hasError;
        ui.error.textContent = hasError ? state.error : '';
    }
}

function patchUI() {
    patchMode();

    const rows = Array.isArray(state.rows) ? state.rows : [];
    rows.forEach(row => {
        if (Number(state.mode) === 0) {
            patchHeatRow(row);
        } else {
            patchCoolRow(row);
        }
    });

    patchMeta();
}

function renderStructure() {
    const root = document.getElementById('app');
    ui.root = root;
    ui.rows = new Map();
    root.replaceChildren();

    buildMode(root);

    const rows = Array.isArray(state.rows) ? state.rows : [];
    if (rows.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Keine aktiven Räume konfiguriert.';
        root.appendChild(empty);

        const error = document.createElement('div');
        error.className = 'error';
        error.hidden = true;
        root.appendChild(error);
        ui.error = error;

        renderedMode = Number(state.mode) === 1 ? 1 : 0;
        renderedSignature = structureSignature(state);
        patchUI();
        return;
    }

    const mode = Number(state.mode) === 1 ? 1 : 0;
    const table = document.createElement('div');
    table.className = 'table';
    table.appendChild(makeHeader(mode));

    rows.forEach(row => {
        table.appendChild(mode === 0 ? createHeatRow(row) : createCoolRow(row));
    });

    root.appendChild(table);
    ui.table = table;

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'Kühlen = FHB-Ventil geöffnet · Nicht kühlen = FHB-Ventil geschlossen';
    note.hidden = mode !== 1;
    root.appendChild(note);
    ui.note = note;

    const error = document.createElement('div');
    error.className = 'error';
    error.hidden = true;
    root.appendChild(error);
    ui.error = error;

    renderedMode = mode;
    renderedSignature = structureSignature(state);
    patchUI();
}

function handleMessage(data) {
    const next = parseState(data);
    const nextMode = Number(next.mode) === 1 ? 1 : 0;
    const nextSignature = structureSignature(next);

    state = next;

    // Bei normalen S1Target-/Temperaturmeldungen bleibt der DOM vollständig
    // bestehen; nur Werte/Klassen werden gepatcht. Ein kompletter Neuaufbau
    // erfolgt ausschließlich bei Modus- oder Raumstrukturwechsel.
    if (renderedMode !== nextMode || renderedSignature !== nextSignature) {
        renderStructure();
    } else {
        patchUI();
    }
}

renderStructure();
</script>
</body>
</html>
