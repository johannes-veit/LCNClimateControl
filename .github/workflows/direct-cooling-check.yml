name: Direct cooling - PHP/JSON syntax and mask tests
on:
  push:
    branches:
      - feature/cooling-direct-relays-v0.3.0
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JSON syntax
        run: python3 -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json')]; print('JSON OK')"
      - name: Relay isolation model test
        run: php tests/direct_cooling_masks.php
      - name: Automatic fallback and recovery scenarios
        run: php tests/auto_cooling_fallback_test.php
      - name: Native LCN module and relay discovery
        run: php tests/cooling_native_discovery_test.php
      - name: Assert safe automatic fallback enabled
        run: |
          grep -q "RegisterPropertyBoolean('DirectCoolingEnabled', true)" LCNClimateControl/module.php
          grep -q "EnqueueCoolingAutomatically" LCNClimateControl/DirectCooling.php
